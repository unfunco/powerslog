name: CI

on:
  push:
    branches:
    - main
    paths-ignore:
    - .editorconfig
    - .gitattributes
    - .gitignore
    - LICENSE.md
    - README.md

jobs:
  verify:
    name: Verify
    uses: unfunco/meta/.github/workflows/verify-go.yaml@8a2e3873c609d86b9a67b353a9111bd44171240d # v0.3.0

  release:
    name: Release?
    needs: [ verify ]
    permissions:
      contents: write
      pull-requests: write
    uses: unfunco/meta/.github/workflows/release-please.yaml@8a2e3873c609d86b9a67b353a9111bd44171240d # v0.3.0
