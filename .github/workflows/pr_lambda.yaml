name: PR / Lambda

on:
  pull_request:
    branches:
    - main
    paths:
    - "*.go"
    - .github/workflows/pr_lambda.yaml
    - go.mod
    - go.sum
    - lambda/**/*

jobs:
  verify:
    name: Verify
    uses: unfunco/meta/.github/workflows/verify-go.yaml@8a2e3873c609d86b9a67b353a9111bd44171240d # v0.3.0
    with:
      working-directory: lambda
