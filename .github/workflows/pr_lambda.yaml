name: PR / Lambda

on:
  pull_request:
    branches:
    - main
    paths:
    - "*.go"
    - .github/workflows/pr_lambda.yaml
    - go.mod
    - go.sum
    - lambda/**/*

jobs:
  verify:
    name: Verify
    uses: unfunco/meta/.github/workflows/verify-go.yaml@ed74a86a4f828ad47a4c65139c4be4101b23a294 # v0.4.0
    with:
      working-directory: lambda
