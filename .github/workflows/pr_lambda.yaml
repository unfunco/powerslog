name: PR / Lambda

on:
  pull_request:
    branches:
    - main
    paths:
    - "*.go"
    - .github/workflows/pr_lambda.yaml
    - go.mod
    - go.sum
    - lambda/**/*

jobs:
  verify:
    name: Verify
    uses: unfunco/meta/.github/workflows/verify-go.yaml@b40ef8e1b220c86892199cb32e2d65d392e74e34 # v0.4.1
    with:
      working-directory: lambda
